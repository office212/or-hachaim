<script>
/* Finance page logic. Changed 2026-11-03 (see design_suggestions file):
   every Firestore value is escaped (OH_UI.esc / OH_UI.jsArg); amounts are
   summed in cents and shown as $1,234.50; dates are New York dates;
   one operationId per form, reused on retry, so a double click or a
   resend after a network drop records ONE entry; the screen shows an
   entry only after the database accepted it; the activity log records
   the signed-in email, never a hard-coded "Gabbai". */
var esc = OH_UI.esc, jsArg = OH_UI.jsArg, money = OH_UI.money, today = OH_UI.nyDate;
/* text cleanup (Nov 5): only the active language is shown */
function L(he, en){ return window.OH_LANG === "en" ? en : he; }
var WORDS = { charge: ["חיוב", "Charge"], payment: ["תשלום", "Payment"], correction: ["תיקון", "Correction"], active: ["פעיל", "Active"], cancelled: ["מושהה", "Paused"], unpaid: ["לא שולם", "Unpaid"], converted: ["הפך לחיוב", "Converted"], paid: ["שולם", "Paid"], monthly: ["חודשי", "Monthly"], annual: ["שנתי", "Annual"] };
function word(k){ var w = WORDS[k]; return w ? L(w[0], w[1]) : esc(k); }
/* payment method (Nov 5): the words for each method key, used by the add-entry
   form and the annual report; none chosen = "unspecified" = "לא צוין" */
var MW = { unspecified: ["לא צוין", "Not specified"], cash: ["מזומן", "Cash"], check: ["צ׳ק", "Check"], cheque: ["צ׳ק", "Check"], card: ["כרטיס אשראי", "Card"], credit: ["כרטיס אשראי", "Card"], zelle: ["Zelle", "Zelle"], transfer: ["העברה בנקאית", "Bank transfer"], ach: ["העברה בנקאית", "Bank transfer"], qr: ["QR", "QR"] };
var PAY_METHODS = ["cash", "check", "zelle", "card", "transfer"];
function mword(k){ var m = MW[String(k || "unspecified").toLowerCase()]; return m ? L(m[0], m[1]) : esc(k); }
/* the method choice is shown only while "תשלום" is chosen; charges and corrections never carry a method */
function syncMethod(){ var t = document.getElementById("eType"), w = document.getElementById("eMethodWrap"); if(t && w) w.hidden = t.value !== "payment"; }
var cons = [];
var opStore = new window.Idempotency.IdempotencyStore();
function newOp(prefix){ return window.Idempotency.makeOperationId(prefix); }
function totals(c){ return OH_UI.ledgerTotals(c); }
function who(){ var fb = window.OH_FIREBASE; return (fb && fb.user && fb.user.email) || "local preview"; }
function amt$(n){ return '<span class="amt">' + money(n) + '</span>'; }
/* hardening (Nov 5): owed stays "יתרה: $X"; a credit reads "זכות: $X" in green; zero reads "אין חוב ✓" */
function bal$(n, owedHe, owedEn){
  var b = OH_UI.balanceInfo(n);
  if(b.kind === "credit") return '<strong class="bal-credit">' + esc(b.label) + ' <span class="amt">' + b.amount + '</span></strong>';
  if(b.kind === "zero") return '<strong class="bal-zero">' + esc(b.label) + '</strong>';
  return '<strong>' + L(owedHe, owedEn) + amt$(n) + '</strong>';
}
/* hardening (Nov 5): the members list could not be loaded. Never shown as
   "no members yet"; one line and a "נסה שוב" button that loads again. */
var _loadFailed = false;
function loadErrHtml(){ return '<div class="oh-loaderr" role="alert"><span>' + L("לא הצלחנו לטעון את רשימת המתפללים.", "Couldn't load the members list.") + '</span><button class="btn secondary" onclick="retryLoad()">' + L("נסה שוב", "Try again") + '</button></div>'; }
function retryLoad(){ _loadFailed = false; _lastUserEmail = null; var el = document.getElementById("fn"); if(el) el.innerHTML = '<p class="oh-help">' + L("טוען...", "Loading...") + '</p>'; refreshFromFirestore(); }
function renderList(){
  /* Nov 6: the finance screens are drawn by src/ui/oh-fin.js (home, payment,
     nedarim, who owes, member card); this keeps the old name every caller uses. */
  var el = document.getElementById("fn");
  if(_loadFailed){ if(el) el.innerHTML = loadErrHtml(); return; }
  if(window.OH_FIN) OH_FIN.render();
}
function csvCell(v){
  var s = String(v == null ? "" : v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; /* spreadsheet formula injection guard */
  return '"' + s.replace(/"/g, '""') + '"';
}
function exportCSV(id){
  var c = cons.find(function(x){ return x.id === id; }); if(!c) return;
  var csv = "\uFEFFdate,type,amount,description,enteredBy\n" + c.ledger.map(function(e){ return [e.date, e.type, e.amount, e.description, e.enteredBy].map(csvCell).join(","); }).join("\n");
  var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv;charset=utf-8"})); a.download = String(c.id).replace(/[^\w-]/g, "_") + "-statement-" + today() + ".csv"; a.click();
  logLine("backup", "יוצא קובץ CSV של " + c.name, { code: "export.csv", target: c.name, targetId: c.id });
}
/* Add a mitpalel: saved to Firestore through saveCongregant (the
   existing congregants collection and rules). One pending document id
   is kept until a confirmed save, so a double tap or a retry writes the
   same document and never creates two. Nothing is added on screen
   unless it was saved. The test-only path (no Firestore) keeps the old
   local preview, as addEntry does. */
var pendingCongId = null;
/* Hebrew and English kept in their own direction, so the punctuation of
   one never jumps into the other on a right-to-left page. */
function addMsg(he, en){ document.getElementById("addMsg").textContent = L(he, en); }
async function addCong(){
  var btn = document.getElementById("addCongBtn");
  if(btn.disabled) return; /* a save is already running */
  var n = document.getElementById("newName").value.trim();
  var phone = document.getElementById("newPhone").value.trim();
  var email = document.getElementById("newEmail").value.trim().toLowerCase();
  if(_loadFailed){ addMsg("קודם צריך לטעון את רשימת המתפללים. לחץ נסה שוב.", "Load the members list first. Tap Try again."); return; }
  if(!n){ addMsg("הזן שם.", "Enter a name."); return; }
  /* Email-required (Hanoch 2026-11-05): a congregant without an email can
     never sign in, and a second record for the same person becomes a
     duplicate account. */
  if(!email){ addMsg("המייל חובה. בלי מייל אין כניסה לאתר.", "Email is required. Without an email there is no sign-in."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ addMsg("המייל לא תקין.", "The email is not valid."); return; }
  if(cons.some(function(c){ return String(c.email || "").toLowerCase() === email; })){
    /* same email: the member already exists, so nothing is saved. The
       popup explains why a second record is a duplicate account. */
    await OH_UI.tell(L("המתפלל הזה כבר קיים", "This member already exists") + "\n" +
      L("כבר יש רשומה עם המייל הזה. הוספת רשומה שנייה תיצור חשבון כפול: לאותו אדם יהיו שני חשבונות, והיתרה וההיסטוריה שלו יתפצלו ביניהם.", "A record with this email already exists. Adding a second record would create a duplicate account: the same person would have two accounts, and their balance and history would split between them.") + "\n" +
      L("אפשר לעדכן את הרשומה הקיימת במקום להוסיף חדשה.", "Update the existing record instead of adding a new one."));
    addMsg("כבר קיים מתפלל עם המייל הזה.", "A member with this email already exists.");
    return;
  }
  /* same name and phone, different email: probably the same person with a
     new email. Warn before creating a second record; confirming saves it. */
  var digits = phone.replace(/\D/g, "");
  var samePerson = digits ? cons.find(function(c){ return String(c.name || "").trim().toLowerCase() === n.toLowerCase() && String(c.phone || "").replace(/\D/g, "") === digits; }) : null;
  if(samePerson){
    var go = await OH_UI.ask(L("יכול להיות שזה אותו מתפלל", "This may be the same member") + "\n" +
      L("כבר יש רשומה עם אותו שם ואותו טלפון, אבל עם מייל אחר. הוספת רשומה שנייה תיצור חשבון כפול: לאותו אדם יהיו שני חשבונות, והיתרה וההיסטוריה שלו יתפצלו ביניהם.", "A record already exists with the same name and phone, but a different email. Adding a second record would create a duplicate account: the same person would have two accounts, and their balance and history would split between them.") + "\n" +
      L("אם המייל השתנה, עדיף להוסיף אותו לרשומה הקיימת. להוסיף בכל זאת?", "If the email changed, add it to the existing record instead. Add anyway?"),
      { ok: L("הוסף בכל זאת", "Add anyway") });
    if(!go){ addMsg("בוטל. אפשר לעדכן את המייל ברשומה הקיימת.", "Cancelled. You can update the email on the existing record instead."); return; }
  }
  var fb = window.OH_FIREBASE;
  if(!pendingCongId && fb && fb.newCongregantId) pendingCongId = fb.newCongregantId();
  btn.disabled = true; addMsg("שומר...", "Saving...");
  var r = (fb && fb.saveCongregant) ? await fb.saveCongregant({ id: pendingCongId, name: n, phone: phone, email: email }) : { saved: false, reason: "test-only" };
  btn.disabled = false;
  if(r.saved || r.reason === "test-only"){
    var id = r.saved ? r.id : "local-" + Date.now();
    if(!cons.some(function(c){ return c.id === id; })) cons.push({ id: id, name: n, phone: phone, email: email, ledger: [] });
    pendingCongId = null; /* the next add gets a new id */
    ["newName", "newPhone", "newEmail"].forEach(function(f){ document.getElementById(f).value = ""; });
    if(r.saved && !r.already) logLine("members", "נוסף מתפלל: " + n + (email ? " (עם מייל)" : ""), { code: "member.add", target: n, targetId: id });
    if(r.saved) addMsg("נשמר.", "Saved."); else addMsg("תצוגה מקומית בלבד, לא נשמר.", "Local preview only, not saved.");
    renderList(); renderNederCong();
  } else if(r.reason === "duplicate-email"){
    addMsg("כבר קיים מתפלל עם המייל הזה.", "A member with this email already exists.");
  } else {
    var why = { "permission-denied": ["אין הרשאה", "No permission"], "unavailable": ["אין חיבור", "No connection"], "not-signed-in": ["לא מחובר", "Not signed in"], "missing-email": ["המייל חובה", "Email is required"], "invalid-email": ["המייל לא תקין", "The email is not valid"] }[r.reason] || [r.reason, r.reason];
    addMsg("לא נשמר (" + why[0] + "). לחץ שוב.", "Not saved (" + why[1] + "). Tap again.");
  }
}
/* Activity log (Nov 5): one line in the shared log (OH_FIREBASE.logActivity,
   read only by the super admin on gabbai/activity/), written only after the
   real save succeeded. Hebrew sentence; a failure never blocks the action. */
function logLine(area, sentence, extra){
  var fb = window.OH_FIREBASE;
  if(fb && fb.logActivity && fb.user) fb.logActivity(sentence, "", Object.assign({ area: area }, extra || {}));
}
var TYPE_HE = { charge: "חיוב", payment: "תשלום", correction: "תיקון" };
var pledges = [];
/* Nov 6: nedarim are entered on the Shabbat nedarim screen (src/ui/oh-fin.js),
   every aliyah in one table plus pledges, one save; the old one-neder form is gone. */
function renderNederCong(){ if(window.OH_FIN) OH_FIN.render(); }
var recs = [];
function renderRec(){
  document.getElementById("recList").innerHTML = recs.map(function(r){
    var c = cons.find(function(x){ return x.id === r.congregantId; });
    return "<p>" + esc(r.name) + " | " + esc(c ? c.name : r.congregantId) + " | " + amt$(r.amount) + " | " + word(r.period) + " | " + word(r.status) + " | " + L("החיוב הבא: ", "Next: ") + esc(r.nextDue) +
    ' <button class="btn secondary" style="width:auto;min-height:44px;padding:8px 14px" onclick="toggleRec(' + jsArg(r.id) + ')">' + (r.status === "active" ? L("השהה", "Pause") : L("הפעל שוב", "Resume")) + '</button></p>';
  }).join("");
}
function toggleRec(id){
  var r = recs.find(function(x){ return x.id === id; }); if(!r) return;
  r.status = (r.status === "active") ? "cancelled" : "active";
  /* nothing is saved here (the schedules are on this page only), so no log line */
  document.getElementById("recMsg").textContent = L("עודכן. החיובים הקודמים נשארו.", "Updated. Past charges are kept.");
  renderRec();
}
/* Recurring charges: only schedules whose nextDue has arrived are
   charged, and the operationId is built from the schedule id and the
   due date ("rec-<id>-<date>"). Pressing the button twice, or two
   gabbaim pressing it, can never charge the same month twice. */
async function applyRecurring(){
  var applied = 0, skipped = 0, failed = 0, d = today(), fb = window.OH_FIREBASE;
  for (var i = 0; i < recs.length; i++) {
    var r = recs[i];
    if (r.status !== "active" || !r.nextDue || r.nextDue > d) { skipped++; continue; }
    var c = cons.find(function(x){ return x.id === r.congregantId; });
    if (!c) { skipped++; continue; }
    var opId = "rec-" + r.id + "-" + r.nextDue;
    var entry = { congregantId: c.id, date: r.nextDue, type: "charge", amount: r.amount, description: "Recurring: " + r.name, operationId: opId, source: "recurring" };
    var res = (fb && fb.saveLedgerEntry) ? await fb.saveLedgerEntry(entry) : { saved: false, reason: "test-only" };
    if (res.saved || res.reason === "test-only") {
      c.ledger.push({ date: entry.date, operationId: opId, type: "charge", amount: r.amount, description: entry.description, enteredBy: who() });
      applied++;
      if (res.saved) logLine("finance", "נרשם חיוב קבוע של " + money(r.amount) + " ל" + c.name + " (" + r.name + ")", { code: "ledger.recurring", target: c.name, targetId: c.id, amount: r.amount });
    } else if (res.reason !== "duplicate-operationId") { failed++; continue; }
    r.nextDue = OH_UI.addMonths(r.nextDue, r.period === "annual" ? 12 : 1);
  }
  document.getElementById("recMsg").textContent = L("חויבו: ", "Charged: ") + applied + L(". עוד לא הגיע זמנם: ", ". Not due yet: ") + skipped + (failed ? L(". נכשלו: ", ". Failed: ") + failed + L(" (לחץ שוב).", " (tap again).") : ".");
  renderList(); renderRec();
}
function renderPledges(){
  var el = document.getElementById("pledgeList"); if(!el) return;
  el.innerHTML = pledges.map(function(p){
    var c = cons.find(function(x){ return x.id === p.congregantId; });
    return "<p>" + esc(OH_UI.usDate(p.date)) + " | " + esc(c ? c.name : p.congregantId) + " | " + esc(p.name) + " | " + amt$(p.amount) + " | " + L("עלייה: ", "Aliyah: ") + esc(p.aliyah) + " | " + word(p.status) + "</p>";
  }).join("");
}
function annualReport(){
  var year = String(document.getElementById("annualYear").value || today().slice(0, 4)).trim();
  var r = window.FinanceStates.annualReport(cons, pledges, year);
  /* 6c (Nov 5): a word for the method, not the raw key; none recorded = "לא צוין" (words in MW above) */
  var methods = Object.keys(r.paymentsByMethod).map(function(k){ var m = MW[String(k).toLowerCase()]; return esc(m ? L(m[0], m[1]) : k) + ": " + amt$(r.paymentsByMethod[k]); }).join(" | ") || "-";
  document.getElementById("annualArea").innerHTML =
    '<div class="gold-frame" style="margin:1rem 0"><h3>' + L("דוח שנתי ", "Annual report ") + esc(year) + '</h3>' +
    '<p>' + L("הכנסות ב-", "Income in ") + esc(year) + ': ' + amt$(r.totalIncome) + '</p>' +
    '<p>' + L("חיובים ב-", "Charges in ") + esc(year) + ': ' + amt$(r.totalCharges) + '</p>' +
    '<p>' + L("יתרות פתוחות (מתמיד): ", "Open balances (all time): ") + amt$(r.openBalances) + '</p>' +
    '<p>' + L("תשלומים לפי אמצעי: ", "Payments by method: ") + methods + '</p>' +
    '<p>' + L("התחייבויות שלא שולמו: ", "Unpaid pledges: ") + amt$(r.unpaidCommitments) + '</p>' +
    '<p><small>' + L("התחייבות שלא שולמה אינה הכנסה.", "An unpaid pledge is not income.") + '</small></p></div>';
  logLine("finance", "הופק דוח שנתי לשנת " + year, { code: "report.annual" });
}
function taxLetters(){
  var year = String(document.getElementById("taxYear").value || today().slice(0, 4)).trim();
  /* Stage D: inactive members still get their letter; join requests do not */
  var html = cons.filter(function(c){ return !window.OH_MEMBERS || window.OH_MEMBERS.isMember(c); }).map(function(c){
    var pays = c.ledger.filter(function(e){ return e.type === "payment" && String(e.date).indexOf(year) === 0; });
    var total = pays.reduce(function(s, e){ return s + OH_UI.cents(e.amount); }, 0) / 100;
    return '<div class="gold-frame tax-letter" style="margin:1rem 0"><h3>' + L("מכתב 501c3", "501c3 letter") + ' (' + esc(year) + '): ' + esc(c.name) + '</h3>' +
    '<p>Payments recorded in ' + esc(year) + ': ' + amt$(total) + ' (' + pays.length + ' payment(s)).</p>' +
    '<p>Dear ' + esc(c.name) + ', thank you for your support of Or Hachaim Congregation in ' + esc(year) + '.</p></div>';
  }).join("");
  document.getElementById("taxArea").innerHTML = html + (html ? '<button class="btn btn-gold" style="width:auto" onclick="printTaxLetters()">' + L("הדפס את כל המכתבים", "Print all letters") + '</button>' : "");
  logLine("finance", "הופקו מכתבי מס לשנת " + year + " (" + cons.length + " מתפללים)", { code: "report.tax" });
}
/* The print rule shows only #printArea. Letters are copied there (one
   per page) before printing; before this, printing showed the open
   congregant card instead of the letters. */
function printTaxLetters(){
  var letters = document.querySelectorAll("#taxArea .tax-letter");
  document.getElementById("printArea").innerHTML = Array.prototype.map.call(letters, function(n){ return n.outerHTML; }).join("");
  window.print();
}
function backupExport(){
  var data = { exportedAt: new Date().toISOString(), exportedBy: who(), congregants: cons, pledges: pledges, recurringSchedules: recs, note: "Restore imports only missing entries and never deletes or overwrites existing entries. Automatic daily backup with a copy outside Firebase and a tested full restore is the standard." };
  var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type: "application/json"})); a.download = "or-hachaim-finance-backup-" + today() + ".json"; a.click();
  document.getElementById("backupMsg").textContent = L("הגיבוי ירד למכשיר.", "Backup downloaded.");
  logLine("backup", "הורד גיבוי כספים מלא", { code: "backup.finance" });
}
renderList(); renderNederCong(); renderRec(); renderPledges();
var _lastUserEmail = null;
function signInFromGate(){
  var fb = window.OH_FIREBASE;
  if(!fb || !fb.signIn){ document.getElementById('gateMsg').textContent = L('הכניסה עוד לא מוכנה. נסה שוב בעוד רגע.', 'Sign-in is not ready yet. Try again in a moment.'); return; }
  if(fb.user){ fb.signOut(); return; }
  var r = fb.signIn();
  if(r && r.catch) r.catch(function(e){ document.getElementById('gateMsg').textContent = L('הכניסה לא הצליחה: ', 'Sign-in failed: ') + (e && e.message ? e.message : e); });
}
async function refreshFromFirestore(){
  try {
    var fb = window.OH_FIREBASE;
    if(!fb || !fb.ready || !fb.user) { document.body.classList.add('gated'); document.getElementById('gateMsg').textContent = ''; if(_lastUserEmail !== null){ _lastUserEmail = null; cons = []; document.getElementById('dataSource').textContent = L('כניסה נדרשת', 'Sign-in required'); renderList(); renderNederCong(); } return; }
    var role = await fb.resolveRole();
    if(!role || !fb.canAccess('finance')) { document.body.classList.add('gated'); if(role){ if(role.authorized){ location.replace('../gabbai/'); return; } document.getElementById('gateMsg').textContent = (window.OH_LABELS && window.OH_LABELS.notAuthorized) || 'החשבון הזה אינו מורשה למערכת הגבאים.'; } /* 2040 phase 1: no access prompts; a gabbai on a page that is not theirs goes home */ _lastUserEmail = null; cons = []; document.getElementById('dataSource').textContent = L('כניסה נדרשת', 'Sign-in required'); renderList(); renderNederCong(); return; }
    document.body.classList.remove('gated'); document.getElementById('gateMsg').textContent = '';
    var email = fb.user.email || '';
    if(email === _lastUserEmail) return;
    _lastUserEmail = email;
    var live = await fb.loadCongregants();
    _loadFailed = !live && !!fb.lastLoadError;
    if(_loadFailed){ cons = []; document.getElementById('dataSource').textContent = L('מחובר: ', 'Signed in: ') + email; renderList(); renderNederCong(); return; }
    if(live && live.length){ cons = live; document.getElementById('dataSource').textContent = L('מחובר: ', 'Signed in: ') + email; renderList(); renderNederCong(); }
    else { cons = []; document.getElementById('dataSource').textContent = L('מחובר: ', 'Signed in: ') + email + L(', אין מתפללים עדיין', ', no members yet'); renderList(); renderNederCong(); }
    /* Stage D: join requests, roles, inactive (super admin); the toggle for everyone here */
    if(window.OH_MEMBERS) OH_MEMBERS.attach(cons, function(){ renderList(); renderNederCong(); });
  } catch(e) {}
}
setInterval(refreshFromFirestore, 1000);
refreshFromFirestore();
</script>
