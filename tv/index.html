<!-- Public TV screen, no sign-in, no sensitive data, loads only daily zmanim JSON, prayerTimes and the PUBLISHED + PUBLIC screen items (screenItems), never drafts, history, congregants, ledger, users, or finance, and links to no internal page. 2040 phase 1: day state, live prayer times with rules, offline cache (sw.js), every word editable (src/tv/tv-texts.js + settings/screenTexts), one look (Hebrew with small English lines) and an editable block order (order + show/hide). -->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script>/* clean URL: /x/index.html shows as /x/ (GitHub Pages has no server redirect) */if(/\/index\.html$/.test(location.pathname)&&history.replaceState)history.replaceState(null,"",location.pathname.replace(/index\.html$/,"")+location.search+location.hash);</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Or Hachaim TV Screen</title>
<link rel="preload" href="../src/assets/fonts/assistant-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../src/assets/fonts/frank-ruhl-libre-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../screen/screen.css">
<link rel="stylesheet" href="../screen/content.css">
<link rel="stylesheet" href="../src/tv/tv-2040.css">
<style>#ohFirebaseStatusBar{display:none !important}</style>
<script src="../src/firebase/firebase-config.js"></script>
<script src="../src/firebase/firebase-app.js"></script>
<script src="../src/engines/shabbat-safe.js"></script>
<script src="../src/engines/display-engine.js"></script>
<script src="../src/firebase/screen-content.js"></script>
<script src="../src/ui/oh-ui.js"></script>
</head>
<body>
<div class="tv">
  <header>
    <div class="logo-plaque"><img class="logo" src="../src/assets/logo-4k-transparent.png" alt="Or Hachaim logo, unchanged"></div>
    <div class="dates">
      <div id="dsTitle" class="ds-title" hidden></div>
      <h1 class="sr-only"><span class="he">אור החיים</span> / Or Hachaim Shul</h1>
      <div id="hebrewDateLine"></div>
      <div id="dateLine" dir="ltr"></div>
    </div>
    <div class="meta">
      <div id="clock" dir="ltr">--:--:--</div>
    </div>
  </header>
  <main>
    <section class="col col-zmanim">
      <h2><span class="h-he" data-tt="colZmanim" data-tp="p">זמני היום</span><span class="h-en" data-tt="colZmanim" data-tp="s">Daily Zmanim</span><span class="zman-day-label" id="zmanDayLabel" hidden></span></h2>
      <div class="col-body" id="zmanBody">
        <div class="col-track">
          <div id="zmanList"></div>
          <div id="shabbatBlock" class="shabbat-sec"></div>
        </div>
      </div>
    </section>
    <section class="col col-center">
      <div class="ds-card" id="dsCard" hidden></div>
      <div class="ins-strip" id="insStrip" hidden></div>
      <div class="next-strip" id="nextHero"><span class="next-label"><span class="he" data-tt="nextZmanLabel" data-tp="p">הזמן הבא</span><span class="en" data-tt="nextZmanLabel" data-tp="s">Next</span></span><span class="next-name" id="nextHeroName"><span class="he" data-tt="loadingText" data-tp="p">טוען</span><span class="en" data-tt="loadingText" data-tp="s">Loading</span></span><span class="next-time" id="nextHeroTime" dir="ltr">--:--</span><span id="netzBox" class="netz-note"></span><span class="next-countdown" id="nextHeroCountdown"></span></div>
      <h2 class="board-title"><span class="h-he" data-tt="boardTitle" data-tp="p">לוח הקהילה</span><span class="h-en" data-tt="boardTitle" data-tp="s">Community Board</span></h2>
      <div id="centerZone"></div>
      <p class="board-index" id="boardIndex"></p>
    </section>
    <section class="col col-prayers">
      <h2><span class="h-he" data-tt="colPrayers" data-tp="p">זמני תפילות</span><span class="h-en" data-tt="colPrayers" data-tp="s">Davening Times</span></h2>
      <div class="next-minyan" id="nextMinyan" hidden></div>
      <div class="col-body" id="prayerBody">
        <div class="col-track">
          <div id="prayerList"></div>
        </div>
      </div>
    </section>
  </main>
  <footer>
    <span class="f-name"><span class="he" data-tt="footerName" data-tp="p">אור החיים</span> <span class="f-addr" dir="ltr" data-tt="footerAddress" data-tp="p">321 Harold St, Staten Island, NY 10314</span></span>
    <span class="ornament" aria-hidden="true">✦</span>
    <span id="ticker" class="ticker"><span class="ticker-placeholder" data-tt="tickerPlaceholder" data-tp="p">PLACEHOLDER / פליסהולדר: permanent dedications and campaign board, to be entered by a gabbai.</span></span>
    <span id="offlineNote" class="offline-note" role="status"></span>
    <span id="ohOffline" class="oh-offline" role="status" hidden></span>
  </footer>
</div>
<div class="controls no-print"><button class="btn btn-gold" id="shabbatToggle">תצוגת שבת</button></div>
<script>
/* 2040 phase 1: the prayer list is painted by ../src/tv/tv-live.js from a
   LIVE listener (no 60 s polling, no reload); rules per day come from
   ../src/tv/prayer-rules.js. Safety net: if that file ever fails to load,
   the old reader below takes over after 20 s, exactly as before. */
function escHtml(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function renderPrayer(list){
  if(!list || !list.length){ document.getElementById("prayerList").innerHTML = "<p>" + escHtml(window.OH_TV_TEXTS ? window.OH_TV_TEXTS.t("noPrayerTimes") : "אין זמני תפילה עדיין") + "</p>"; return; }
  document.getElementById("prayerList").innerHTML = list.map(function (p) {
    return '<div class="zman-row"><span class="zn"><span class="he">' + escHtml(p.nameHe || p.nameEn || '') + '</span><span class="en">' + escHtml(p.nameEn || '') + '</span></span><span class="zt" dir="ltr">' + escHtml(p.time || '') + '</span></div>';
  }).join("");
}
setTimeout(function(){
  if (window.OH_TV) return; /* the living screen is running */
  setInterval(async function(){
    try { var fb = window.OH_FIREBASE; if(!fb || !fb.ready) return; var live = await fb.loadScreenData(); renderPrayer(live && live.prayerTimes ? live.prayerTimes : []); } catch(e) {}
  }, 60000);
}, 20000);
</script>
<script src="../src/zmanim/rabbeinu-tam.js"></script>
<script src="../src/calendar/or-calendar.min.js"></script>
<script src="../src/tv/tv-texts.js"></script>
<script src="../src/tv/day-state.js"></script>
<script src="../src/tv/prayer-rules.js"></script>
<script src="../src/tv/tv-live.js"></script>
<script src="../src/calendar/screen-calendar.js"></script>
<script src="../src/calendar/oh-hooks.js"></script>
<script src="../screen/content-board.js"></script>
<script src="../screen/screen.js"></script>
</body>
</html>
