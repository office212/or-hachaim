<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><script>/* clean URL: /x/index.html shows as /x/ (GitHub Pages has no server redirect) */if(/\/index\.html$/.test(location.pathname)&&history.replaceState)history.replaceState(null,"",location.pathname.replace(/index\.html$/,"")+location.search+location.hash);</script><meta name="viewport" content="width=device-width, initial-scale=1">
<title>גיבוי נתונים</title>
<link rel="stylesheet" href="../src/theme.css">
<link rel="stylesheet" href="../src/ui/oh-design.css">
<script src="../src/ui/labels.js"></script>
<script src="../src/ui/oh-shell.js" defer></script>
<script src="../src/firebase/firebase-config.js"></script>
<script src="../src/firebase/firebase-app.js"></script><meta name="theme-color" content="#0e2c4c">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="אור החיים">
<script src="/src/pwa/pwa-app.js" defer></script>
</head>
<body data-oha-page="backup">
<script>function L(he, en){ return window.OH_LANG === "en" ? en : he; } /* text cleanup (Nov 5): only the active language */</script>

<div class="page">
<div class="gold-frame tool-card">
<h2>גיבוי נתונים</h2>
<p class="oh-help">מוריד קובץ גיבוי של כל הנתונים. לא מוחק ולא משנה דבר.</p>
<button class="btn" onclick="runBackup()">הורדת קובץ גיבוי</button>
<p id="backupMsg"></p>
<pre id="backupOut" style="white-space:pre-wrap"></pre>
</div>
<script>
async function runBackup(){
  var fb = window.OH_FIREBASE;
  if(!fb || !fb.ready || !fb.user){ document.getElementById('backupMsg').textContent = L('קודם צריך להתחבר.', 'Sign in first.'); return; }
  if(typeof fb._db !== 'function'){ document.getElementById('backupMsg').textContent = L('הדף לא עדכני. רענן את הדף ונסה שוב.', 'The page is out of date. Reload it and try again.'); return; }
  document.getElementById('backupMsg').textContent = L('מוריד...', 'Downloading...');
  var out = { exportedAt: new Date().toISOString(), exportedBy: fb.user.email, collections: {}, denied: [] };
  /* Every collection the rules define, not only five: pledges, recurring
     schedules, the activity log and the screen content were missing. */
  var cols = ['congregants','ledgerEntries','operationIds','pledges','recurringSchedules','activityLog','prayerTimes','announcements','dedications','sponsors','flyers','yahrzeits','backups','users'];
  for(var i=0;i<cols.length;i++){
    var col = cols[i];
    try {
      var snap = await fb._db().collection(col).get();
      var docs = [];
      snap.forEach(function(d){ var o = d.data() || {}; o._id = d.id; docs.push(o); });
      out.collections[col] = docs;
    } catch(e) { out.denied.push(col + ' (' + (e && e.code ? e.code : (e && e.message ? e.message : e)) + ')'); out.collections[col] = []; }
  }
  var counts = cols.map(function(c){ return c + ': ' + out.collections[c].length; }).join(', ');
  document.getElementById('backupMsg').textContent = L('הגיבוי ירד. ', 'Backup downloaded. ') + counts + (out.denied.length ? L(' לא נקרא: ', ' Not read: ') + out.denied.join(', ') : '');
  document.getElementById('backupOut').textContent = JSON.stringify(out, null, 2).slice(0, 4000);
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], {type: 'application/json'}));
  a.download = 'or-hachaim-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  if(fb.logActivity) fb.logActivity('הורד גיבוי מלא של האתר', '', { area: 'backup', code: 'backup.full' }); /* activity log (Nov 5) */
}
</script>
</div></body></html>
