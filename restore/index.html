<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><script>/* clean URL: /x/index.html shows as /x/ (GitHub Pages has no server redirect) */if(/\/index\.html$/.test(location.pathname)&&history.replaceState)history.replaceState(null,"",location.pathname.replace(/index\.html$/,"")+location.search+location.hash);</script><meta name="viewport" content="width=device-width, initial-scale=1">
<title>שחזור נתונים</title>
<link rel="stylesheet" href="../src/theme.css">
<link rel="stylesheet" href="../src/ui/oh-design.css">
<script src="../src/ui/labels.js"></script>
<script src="../src/ui/oh-shell.js" defer></script>
<script src="../src/firebase/firebase-config.js"></script>
<script src="../src/firebase/firebase-app.js"></script><meta name="theme-color" content="#0e2c4c">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="אור החיים">
<script src="/src/pwa/pwa-app.js" defer></script>
</head>
<body data-oha-page="restore">
<script>function L(he, en){ return window.OH_LANG === "en" ? en : he; } /* text cleanup (Nov 5): only the active language */</script>

<div class="page">
<p id="pgGate" style="text-align:center;padding:2rem 1rem;font-size:1.1rem" hidden></p>
<div class="gold-frame tool-card" hidden>
<h2>שחזור נתונים</h2>
<p class="oh-help">מחזיר מקובץ גיבוי רק מה שחסר. לא מוחק ולא דורס דבר.</p>
<input type="file" id="backupFile" accept="application/json">
<button class="btn" onclick="dryRun()" id="dryRunBtn">שלב 1: בדיקה (בלי שינוי)</button>
<button class="btn" onclick="doImport()" id="importBtn" disabled>שלב 2: החזרת מה שחסר</button>
<p id="restoreMsg" role="status" aria-live="polite"></p>
<pre id="restoreOut" data-no-i18n dir="ltr" style="white-space:pre-wrap;text-align:left"></pre>
</div>
<script>
var _backup = null; var _missing = [];
function readFile(){
  return new Promise(function(resolve, reject){
    var f = document.getElementById('backupFile').files[0];
    if(!f){ reject(new Error(L('קודם בוחרים קובץ גיבוי.', 'Choose a backup file first.'))); return; }
    var r = new FileReader();
    r.onload = function(){ try { resolve(JSON.parse(r.result)); } catch(e){ reject(e); } };
    r.onerror = reject; r.readAsText(f);
  });
}
/* Nov 6 (production audit): step 1 used to read the 70+ documents one after
   another and say nothing until the very end, so on a phone it looked as if
   the button did nothing. Now: a message right away, reads in parallel (at
   most 8 at a time, each with a time limit), progress per collection, and
   every error shown here on the page. Step 1 only reads (.get), never writes. */
var RESTORE_COLS = ['congregants','ledgerEntries','operationIds','pledges','recurringSchedules','nedarim','activityLog','prayerTimes','announcements','dedications','sponsors','flyers','yahrzeits','yahrzeitRequests','settings','backups','users']; /* same list as the backup page */
var _dryRunBusy = false;
function restoreSay(t){ document.getElementById('restoreMsg').textContent = t; }
function withTimeout(p, ms){
  return new Promise(function(resolve, reject){
    var t = setTimeout(function(){ var e = new Error(L('אין תשובה מהשרת', 'no answer from the server')); e.code = 'timeout'; reject(e); }, ms);
    p.then(function(v){ clearTimeout(t); resolve(v); }, function(e){ clearTimeout(t); reject(e); });
  });
}
async function dryRun(){
  if(_dryRunBusy) return;
  var btn = document.getElementById('dryRunBtn'), out = document.getElementById('restoreOut');
  _dryRunBusy = true; if(btn) btn.disabled = true;
  document.getElementById('importBtn').disabled = true; _missing = [];
  out.textContent = ''; restoreSay(L('בודק…', 'Checking…'));
  try {
    var fb = window.OH_FIREBASE;
    if(!fb || !fb.ready || !fb.user){ restoreSay(L('קודם צריך להתחבר.', 'Sign in first.')); return; }
    var db = fb._db && fb._db();
    if(!db){ restoreSay(L('אין חיבור למסד הנתונים. לרענן את הדף ולנסות שוב.', 'No database connection. Reload the page and try again.')); return; }
    try { _backup = await readFile(); } catch(e){ restoreSay(L('בעיה בקובץ: ', 'File problem: ') + (e && e.message || e)); return; }
    if(!_backup || typeof _backup.collections !== 'object' || !_backup.collections){ restoreSay(L('זה לא קובץ גיבוי (אין בו collections).', 'This is not a backup file (no collections in it).')); return; }
    /* the list of reads, and progress per collection */
    var jobs = [], prog = {}, order = [];
    RESTORE_COLS.forEach(function(col){
      var docs = _backup.collections[col]; if(!Array.isArray(docs) || !docs.length) return;
      prog[col] = { total: 0, done: 0, missing: 0, errors: 0 }; order.push(col);
      docs.forEach(function(d){
        /* Nov 6: the manual backup (backup/) keeps each document id as _id, the
           nightly cloud backup (functions/dailybackup) as id: both are read */
        var id = d && (d._id || d.id); if(!id) return;
        prog[col].total++; jobs.push({ col: col, id: String(id), doc: d });
      });
    });
    if(!jobs.length){ restoreSay(L('אין בקובץ מסמכים לבדיקה.', 'The file has no documents to check.')); return; }
    var results = new Array(jobs.length), next = 0, doneCount = 0;
    function render(){
      out.textContent = order.map(function(col){ var p = prog[col];
        return col + ': ' + p.done + '/' + p.total + L(' נבדקו', ' checked') + (p.missing ? L(', חסרים ', ', missing ') + p.missing : '') + (p.errors ? L(', שגיאות ', ', errors ') + p.errors : ''); }).join('\n');
      restoreSay(L('בודק… ', 'Checking… ') + doneCount + '/' + jobs.length);
    }
    render();
    async function worker(){
      while(next < jobs.length){
        var k = next++, j = jobs[k], p = prog[j.col];
        try {
          var snap = await withTimeout(db.collection(j.col).doc(j.id).get(), 20000);
          results[k] = snap.exists ? 'skip' : 'missing';
          if(!snap.exists) p.missing++;
        } catch(e){ results[k] = 'error'; j.err = (e && (e.code || e.message)) || String(e); p.errors++; }
        p.done++; doneCount++; render();
      }
    }
    var workers = []; for(var w = 0; w < Math.min(8, jobs.length); w++) workers.push(worker());
    await Promise.all(workers);
    var lines = [], errors = [];
    jobs.forEach(function(j, k){
      if(results[k] === 'missing'){ _missing.push({col: j.col, id: j.id, doc: j.doc}); lines.push('MISSING: ' + j.col + '/' + j.id); }
      else if(results[k] === 'skip'){ lines.push('SKIP (exists): ' + j.col + '/' + j.id); }
      else { errors.push(j.col + '/' + j.id + ' (' + j.err + ')'); lines.push('ERROR checking ' + j.col + '/' + j.id + ': ' + j.err); }
    });
    var summary = order.map(function(col){ var p = prog[col]; return col + ': ' + p.total + L(' נבדקו', ' checked') + ', ' + L('חסרים ', 'missing ') + p.missing + (p.errors ? ', ' + L('שגיאות ', 'errors ') + p.errors : ''); });
    out.textContent = summary.join('\n') + '\n\n' + lines.join('\n');
    restoreSay(L('הבדיקה הסתיימה. נבדקו ', 'Check done. Checked ') + jobs.length + L('. חסרים: ', '. Missing: ') + _missing.length + '.' +
      (errors.length ? ' ' + L('לא נבדקו (שגיאה): ', 'Could not check (error): ') + errors.length + ' — ' + errors.slice(0, 5).join(', ') + (errors.length > 5 ? ' …' : '') : ''));
    document.getElementById('importBtn').disabled = false;
  } catch(e){
    restoreSay(L('שגיאה בבדיקה: ', 'Check failed: ') + ((e && (e.code || e.message)) || String(e)));
  } finally {
    _dryRunBusy = false; if(btn) btn.disabled = false;
  }
}
async function doImport(){
  var fb = window.OH_FIREBASE;
  if(!fb || !fb.ready || !fb.user){ document.getElementById('restoreMsg').textContent = L('קודם צריך להתחבר.', 'Sign in first.'); return; }
  if(!_missing.length){ document.getElementById('restoreMsg').textContent = L('אין מה להחזיר. קודם שלב 1.', 'Nothing to restore. Do step 1 first.'); return; }
  var created = 0, failed = []; var lines = [];
  for(var i=0;i<_missing.length;i++){
    var m = _missing[i]; var doc = {}, cloud = !('_id' in m.doc); Object.keys(m.doc).forEach(function(k){ if(k !== '_id' && !(cloud && k === 'id')) doc[k] = m.doc[k]; });
    /* Restored ledger entries keep their original date and enteredBy,
       and are marked as restored, with the server time and the uid of
       who restored them. firestore.rules allows this path for the
       super admin only, so a restore never looks like a new entry. */
    if (m.col === 'ledgerEntries' || m.col === 'pledges' || m.col === 'activityLog' || m.col === 'yahrzeitRequests') { doc.restored = true; doc.restoredAt = window.firebase.firestore.FieldValue.serverTimestamp(); doc.restoredBy = fb.user.uid; }
    try { await fb._db().collection(m.col).doc(m.id).set(doc); created++; lines.push('CREATED: ' + m.col + '/' + m.id); }
    catch(e){ failed.push(m.col + '/' + m.id + ' (' + (e.code || e.message) + ')'); lines.push('FAILED: ' + m.col + '/' + m.id + ' ' + (e.code || e.message)); }
  }
  document.getElementById('importBtn').disabled = true; /* run a new dry run before importing again */
  document.getElementById('restoreMsg').textContent = L('הוחזרו: ', 'Restored: ') + created + L(', נכשלו: ', ', failed: ') + failed.length + (failed.length ? ' ' + failed.join(', ') : '');
  document.getElementById('restoreOut').textContent = lines.join('\n');
  if(created && fb.logActivity) fb.logActivity('שוחזרו ' + created + ' רשומות מגיבוי' + (failed.length ? ' (' + failed.length + ' נכשלו)' : ''), '', { area: 'backup', code: 'backup.restore' }); /* activity log (Nov 5) */
}
</script>
</div><script>
/* Nov 6 (repo review): only the people this page is for see its controls
   (the rules already refuse everyone else; this only spares them a page
   that cannot work for them): signed out -> "כניסה נדרשת", no permission -> home. */
(function(){
  var done = false;
  function tick(){
    var fb = window.OH_FIREBASE, card = document.querySelector(".tool-card"), gate = document.getElementById("pgGate");
    if(!card || !gate) return;
    if(!fb || !fb.ready){ return; }
    if(!fb.user){ card.hidden = true; gate.hidden = false; gate.textContent = L("כניסה נדרשת. למנהל הראשי בלבד.", "Sign-in required."); return; }
    Promise.resolve(fb.resolveRole ? fb.resolveRole() : null).then(function(role){
      if(!role) return;
      if(!(role.isSuperAdmin)){ if(!done){ done = true; location.replace(role.authorized ? "../gabbai/" : "../"); } return; }
      card.hidden = false; gate.hidden = true;
    }, function(){});
  }
  setInterval(tick, 1000); tick();
})();
</script>
</body></html>
