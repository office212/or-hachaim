<script>
/* Page gate: a content gabbai or the super admin only; everyone else goes home.
   Unchanged logic from the old admin/index.html's refreshPT(), minus the
   sections that moved to other pages. */
function signInFromGate(){
  var fb = window.OH_FIREBASE;
  if(!fb || !fb.signIn){ document.getElementById('gateMsg').textContent = 'Sign-in is not ready yet. Please try again in a moment.'; return; }
  if(fb.user){ fb.signOut(); return; }
  var r = fb.signIn();
  if(r && r.catch) r.catch(function(e){ document.getElementById('gateMsg').textContent = 'Firebase sign-in failed: ' + (e && e.message ? e.message : e); });
}
var _lastPTUser = null;
async function refreshPT(){
  try {
    var fb = window.OH_FIREBASE;
    if(!fb || !fb.ready || !fb.user){ document.body.classList.add('gated'); document.getElementById('gateMsg').textContent = ''; if(_lastPTUser !== null){ _lastPTUser = null; if(window.OH_PT) OH_PT.hide(); } return; }
    var role = await fb.resolveRole();
    if(!role || !role.authorized){ document.body.classList.add('gated'); if(role){ document.getElementById('gateMsg').textContent = (window.OH_LABELS && window.OH_LABELS.notAuthorized) || 'החשבון הזה אינו מורשה למערכת הגבאים.'; } _lastPTUser = null; if(window.OH_PT) OH_PT.hide(); return; }
    document.body.classList.remove('gated'); document.getElementById('gateMsg').textContent = '';
    if(!role.canScreen){ location.replace('../'); return; }
    var email = fb.user.email || '';
    if(email === _lastPTUser) return;
    _lastPTUser = email;
    if(window.OH_PT) OH_PT.show({ email: email, isSuperAdmin: !!role.isSuperAdmin });
  } catch(e) {}
}
setInterval(refreshPT, 1000);
refreshPT();
</script>
