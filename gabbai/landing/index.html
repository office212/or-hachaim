<section id="htSection" hidden aria-labelledby="htHeading"></section>
<script>
function signInFromGate(){
  var fb = window.OH_FIREBASE;
  if(!fb || !fb.signIn){ document.getElementById('gateMsg').textContent = 'Sign-in is not ready yet. Please try again in a moment.'; return; }
  if(fb.user){ fb.signOut(); return; }
  var r = fb.signIn();
  if(r && r.catch) r.catch(function(e){ document.getElementById('gateMsg').textContent = 'Firebase sign-in failed: ' + (e && e.message ? e.message : e); });
}
/* Page gate: the super admin only (home-texts-editor.js itself already
   checks this on #htSection; this handles the sign-in card and sends
   anyone else home instead of an empty page). */
async function refreshGate(){
  try {
    var fb = window.OH_FIREBASE;
    if(!fb || !fb.ready || !fb.user){ document.body.classList.add('gated'); document.getElementById('gateMsg').textContent = ''; return; }
    var role = await fb.resolveRole();
    if(!role || !role.authorized){ document.body.classList.add('gated'); if(role){ document.getElementById('gateMsg').textContent = (window.OH_LABELS && window.OH_LABELS.notAuthorized) || 'החשבון הזה אינו מורשה למערכת הגבאים.'; } return; }
    document.body.classList.remove('gated'); document.getElementById('gateMsg').textContent = '';
    if(!role.isSuperAdmin){ location.replace('../'); return; }
  } catch(e) {}
}
setInterval(refreshGate, 1000);
refreshGate();
</script>
<script src="../../src/home/home-texts.js"></script>
<script src="../../admin/home-texts-editor.js"></script>
