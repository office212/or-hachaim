<style>
.balance-hero { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 10px 0 18px; padding: 26px 20px 24px; color: var(--ink); border: 1px solid var(--gold); border-radius: var(--radius);
  background: linear-gradient(180deg, rgba(255, 251, 242, 0.86), rgba(246, 236, 214, 0.86)), url("../src/assets/textures/jerusalem-stone.webp"); background-size: auto, 512px; }
.balance-hero .bh-label { font-size: 15px; font-weight: 700; letter-spacing: 0.06em; color: var(--muted); }
.balance-hero .bh-amount { font-size: 46px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; line-height: 1.1; }
/* hardening (Nov 5): a credit reads "זכות" in green, zero reads "אין חוב ✓"; a load error is navy, never red */
.balance-hero.bh-credit .bh-label, .balance-hero.bh-credit .bh-amount { color: #2e6b3f; }
.balance-hero.bh-zero .bh-label { font-size: 28px; letter-spacing: 0; color: var(--navy); }
.oh-loaderr { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; color: var(--navy); font-weight: 700; border: 1px solid var(--navy); border-radius: var(--radius); background: rgba(255, 251, 242, 0.9); }
.oh-loaderr .btn { width: auto; min-height: 48px; margin: 0; }
.ledger-summary { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 28px; color: var(--muted); }
.cong-news { margin-top: 22px; }
.cong-news h2 { color: var(--navy); margin-top: 0; }
.cong-news .cn-item { padding: 14px 0; border-top: 1px solid var(--line); }
.cong-news .cn-item h3 { margin: 0 0 6px; color: var(--navy); font-size: 20px; }
.cong-news .cn-item p { margin: 0; overflow-wrap: anywhere; }
.cong-news .cn-en { color: var(--muted); margin-top: 6px !important; }
.ledger-summary span[dir="ltr"] { margin: 0 0.4em; font-weight: 600; color: var(--navy); }
</style>

<body class="gated" data-oha-page="congregant">

<div class="gate-card" id="signInGate"><h2>כניסה נדרשת</h2><button class="gsi-btn" onclick="signInFromGate()"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34.5 6.1 29.5 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.7 39.7 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg><span>התחברות עם Google</span></button><p class="hint" id="gateMsg"></p></div>

<div id="card"></div>
<!-- Nov 7: family yahrzeits, src/ui/oh-yahrzeit.js -->
<div id="ohYzMount"></div>
<script>
/* Own account view. ledgerTotals now comes from src/ui/oh-ui.js (it used
   to exist only in test-data.js, which this page does not load, so a
   real congregant saw an empty card). Values are escaped, amounts shown
   as $1,234.50, newest entries first, and the balance is the hero. */
function renderCong(c, sourceLabel){
  var esc = OH_UI.esc, money = OH_UI.money, L = function (he, en) { return window.OH_LANG === "en" ? en : he; };
  var t = OH_UI.ledgerTotals(c);
  var rows = (c.ledger || []).slice().sort(function(a, b){ return String(b.date).localeCompare(String(a.date)); });
  var typeHe = { charge: L("חיוב", "Charge"), payment: L("תשלום", "Payment"), correction: L("תיקון", "Correction") };
  document.getElementById("card").innerHTML = '<div class="gold-frame"><h2>' + esc(c.name) + '</h2>' +
  (function(){ var b = OH_UI.balanceInfo(t.balance); /* hardening (Nov 5): owed as before, credit "זכות" in green, zero "אין חוב ✓" */
    return '<div class="balance-hero bh-' + b.kind + '"><span class="bh-label">' + esc(b.label) + '</span>' + (b.amount ? '<span class="bh-amount" dir="ltr">' + b.amount + '</span>' : '') + '</div>'; })() +
  '<p class="ledger-summary"><span>' + L("סך חיובים: ", "Total charges: ") + '<span dir="ltr">' + money(t.charges) + '</span></span><span>' + L("סך תשלומים: ", "Total payments: ") + '<span dir="ltr">' + money(t.payments) + '</span></span></p>' +
  '<table><tr><th>' + L("תאריך", "Date") + '</th><th>' + L("סוג", "Type") + '</th><th>' + L("סכום", "Amount") + '</th><th>' + L("תיאור", "Description") + '</th></tr>' +
  rows.map(function(e){ return "<tr><td>" + esc(OH_UI.usDate(e.date)) + "</td><td>" + esc(typeHe[e.type] || e.type) + '</td><td dir="ltr">' + money(e.amount) + "</td><td>" + esc(e.description) + "</td></tr>"; }).join("") +
  '</table>' + (sourceLabel ? '<p class="oh-help"><small>' + esc(sourceLabel) + '</small></p>' : '') + '</div>';
}
document.getElementById('card').innerHTML = '<p>' + CL_("כניסה נדרשת", "Sign-in required") + '</p>';
var _lastCongUser = null;
function CL_(he, en){ return window.OH_LANG === "en" ? en : he; }
function signInFromGate(){
  var fb = window.OH_FIREBASE;
  if(!fb || !fb.signIn){ document.getElementById('gateMsg').textContent = CL_('הכניסה עוד לא מוכנה. נסה שוב בעוד רגע.', 'Sign-in is not ready yet. Try again in a moment.'); return; }
  if(fb.user){ fb.signOut(); return; }
  var r = fb.signIn();
  if(r && r.catch) r.catch(function(e){ document.getElementById('gateMsg').textContent = CL_('הכניסה לא הצליחה: ', 'Sign-in failed: ') + (e && e.message ? e.message : e); });
}
async function refreshCong(){
  try {
    var fb = window.OH_FIREBASE;
    if(!fb || !fb.ready || !fb.user){ document.body.classList.add('gated'); document.getElementById('gateMsg').textContent = ''; if(_lastCongUser !== null){ _lastCongUser = null; document.getElementById('congSource').textContent = CL_('כניסה נדרשת', 'Sign-in required'); document.getElementById('card').innerHTML = '<p>' + CL_("כניסה נדרשת", "Sign-in required") + '</p>'; if(window.OH_YZ) OH_YZ.member(document.getElementById('ohYzMount'), null); } return; }
    var role = await fb.resolveRole();
    /* 6a (Nov 5): the membership lookup failed: not the join form, one line and "נסה שוב" */
    if(role && role.loadFailed){ document.body.classList.remove('gated', 'joining'); document.getElementById('gateMsg').textContent = ''; if(_lastCongUser !== 'loadfail'){ _lastCongUser = 'loadfail'; document.getElementById('congSource').textContent = CL_('מחובר: ', 'Signed in: ') + (fb.user.email || ''); document.getElementById('card').innerHTML = '<div class="oh-loaderr" role="alert"><span>' + CL_('לא הצלחנו לטעון את החשבון שלך.', "Couldn't load your account.") + '</span><button class="btn secondary" onclick="retryCong()">' + CL_('נסה שוב', 'Try again') + '</button></div>'; } return; }
    /* Stage D: a signed-in person who is not a member yet sees only the join
       screen (or "sent" / "not approved"), nothing else. */
    if(role && !role.authorized && window.OH_MEMBERS && (role.canRequestJoin || role.joinStatus)){
      var jkey = fb.user.uid + '|' + (role.joinStatus || 'form');
      document.body.classList.remove('gated'); document.body.classList.add('joining'); document.getElementById('gateMsg').textContent = '';
      if(_lastCongUser !== 'join:' + jkey){ _lastCongUser = 'join:' + jkey; OH_MEMBERS.renderJoin(document.getElementById('card'), role.joinStatus === 'pending' ? 'pending' : role.joinStatus === 'declined' ? 'declined' : 'form'); }
      return;
    }
    document.body.classList.remove('joining');
    if(!role || !fb.canAccess('congregant')){ document.body.classList.add('gated'); if(role){ if(role.authorized){ location.replace('../gabbai/'); return; } document.getElementById('gateMsg').textContent = (window.OH_LABELS && window.OH_LABELS.notAuthorized) || 'החשבון הזה אינו מורשה למערכת הגבאים.'; } /* 2040 phase 1: no access prompts; a gabbai on a page that is not theirs goes home */ _lastCongUser = null; document.getElementById('congSource').textContent = CL_('כניסה נדרשת', 'Sign-in required'); document.getElementById('card').innerHTML = '<p>' + CL_("כניסה נדרשת", "Sign-in required") + '</p>'; return; }
    var email = fb.user.email || '';
    if(email === _lastCongUser) return;
    document.body.classList.remove('gated'); document.getElementById('gateMsg').textContent = '';
    _lastCongUser = email;
    var own = await fb.loadOwnCongregant();
    /* hardening (Nov 5): a failed load is not "no member card": one line and "נסה שוב" */
    if(!own && fb.lastLoadError){ document.getElementById('congSource').textContent = CL_('מחובר: ', 'Signed in: ') + email; document.getElementById('card').innerHTML = '<div class="oh-loaderr" role="alert"><span>' + CL_('לא הצלחנו לטעון את החשבון שלך.', "Couldn't load your account.") + '</span><button class="btn secondary" onclick="retryCong()">' + CL_('נסה שוב', 'Try again') + '</button></div>'; return; }
    if(own){ document.getElementById('congSource').textContent = CL_('מחובר: ', 'Signed in: ') + email; renderCong(own, ''); if(window.OH_YZ) OH_YZ.member(document.getElementById('ohYzMount'), own); }
    else { document.getElementById('congSource').textContent = CL_('מחובר: ', 'Signed in: ') + email; document.getElementById('card').innerHTML = '<div class="gold-frame" style="padding:1rem"><p>' + CL_('לא נמצא כרטיס מתפלל למייל ', 'No member card for ') + OH_UI.esc(email) + '.</p></div>'; }
  } catch(e) {}
}
function retryCong(){ _lastCongUser = null; document.getElementById('card').innerHTML = '<p class="oh-help">' + CL_('טוען...', 'Loading...') + '</p>'; var fb = window.OH_FIREBASE; if(fb && fb.retryRole && fb.role && fb.role.loadFailed){ Promise.resolve(fb.retryRole()).then(refreshCong, refreshCong); return; } refreshCong(); }
setInterval(refreshCong, 1000);
refreshCong();
</script>
<div id="congNews" class="cong-news" hidden></div>
<script>
/* v4: community announcements for the signed-in congregant (the plan's
   gap "קריאת הכרזות על ידי מתפלל"). Reads only items that are
   published AND public, the same ones the public TV shows, inside
   their date window; payment items are hidden on Shabbat and Yom Tov
   (system rule). Text is escaped. */
(function(){
  var unsub = null;
  function paint(items){
    var box = document.getElementById("congNews"); if(!box || !window.OH_DISPLAY) return;
    var E = window.OH_DISPLAY, ctx = { todayKey: E.nyParts(new Date()).key, rest: E.isRestTime(new Date(), null), publicOnly: true };
    var list = E.activeItems((items || []).filter(function(it){ return it.type === "announcement" || it.type === "rabbi"; }), ctx);
    if(!list.length){ box.hidden = true; box.innerHTML = ""; return; }
    var esc = OH_UI.esc;
    box.hidden = false;
    box.innerHTML = '<div class="gold-frame"><h2>' + (window.OH_LANG === "en" ? "Announcements" : "הודעות הקהילה") + '</h2>' + list.map(function(it){
      /* text cleanup (Nov 5): only the active language; the other one only when it is the only text */
      var en = window.OH_LANG === "en", title = en ? (it.titleEn || it.titleHe) : (it.titleHe || it.titleEn);
      var head = it.type === "rabbi" ? ((E.SUBTYPES.rabbi[it.subtype] || "דבר הרב") + (title ? ": " + title : "")) : (title || "");
      var body = en ? (it.bodyEn || it.bodyHe) : (it.bodyHe || it.bodyEn), ltr = body && body === it.bodyEn;
      return '<article class="cn-item">' + (head ? '<h3>' + esc(head) + '</h3>' : '') + (body ? '<p' + (ltr ? ' dir="ltr" class="cn-en"' : '') + '>' + esc(body).replace(/\n/g, "<br>") + '</p>' : '') + '</article>';
    }).join("") + '</div>';
  }
  setInterval(function(){
    var fb = window.OH_FIREBASE, signed = fb && fb.ready && fb.user && !document.body.classList.contains("gated") && !document.body.classList.contains("joining");
    if(signed && !unsub && window.OH_SCREEN_CONTENT){ unsub = window.OH_SCREEN_CONTENT.subscribe("public", function(items){ paint(items); }); }
    if(!signed && unsub){ unsub(); unsub = null; paint([]); }
  }, 1500);
})();
</script>
